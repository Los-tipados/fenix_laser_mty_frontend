<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicia Sesión | Fénix Láser</title>
    <link rel="icon" href="/activos/imagenes/iconos/logo_fenix_favicon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Importa los estilos de Bootstrap desde un CDN -->

    <!-- Referencia para iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Permite usar íconos de Bootstrap -->

    <!-- CSS externo -->
    <link rel="stylesheet" href="/activos/css/global.css">
    <!-- Estilos globales del proyecto -->

    <link rel="stylesheet" href="/activos/css/iniciar_sesion.css">
    <!-- Estilos específicos de la página de inicio de sesión -->

    <link rel="stylesheet" href="/activos/css/sobre_nosotros.css">
    <!-- Estilos reutilizados de la sección sobre nosotros -->

    <link rel="stylesheet" href="/activos/css/barra_navegacion.css">
    <!-- Estilos de la barra de navegación -->

    <!-- Estilos del footer -->
    <link rel="stylesheet" href="/activos/css/footer.css">
</head>

<body>

    <!-- Barra de navegación -->
    <div id="navbar"></div>


    <!-- Footer (carga dinámica) -->
    <div id="footer-container"></div>

    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="login-card p-5 shadow-lg text-center">

                        <h2 class="fw-bold mb-4" style="color:#E86C1A;">¡Hola de nuevo!</h2>
                        <p class="mb-4">Inicia sesión con tu correo y contraseña</p>

                        <!--  IMPORTANTE: Agregamos id al formulario y name a los inputs -->
                        <form id="inicioSesionForm" novalidate>

                            <!-- Campo de correo -->
                            <div class="mb-4 text-start">
                                <label for="email" class="form-label fw-bold">Correo electrónico</label>
                                <input type="email" class="form-control text-white" id="email" name="email"
                                    placeholder="tunombre@email.com" required>
                                <small id="emailError" class="text-danger d-none"></small>
                            </div>

                            <!-- Campo de contraseña -->
                            <div class="mb-4 text-start">
                                <label for="password" class="form-label fw-bold">Contraseña</label>
                                <input type="password" class="form-control text-white" id="password" name="password"
                                    placeholder="Contraseña" required>
                                <small id="passwordError" class="text-danger d-none"></small>
                            </div>

                            <!-- Enlaces auxiliares -->
                            <div class="d-flex justify-content-between mb-4 small">
                                <a href="/paginas/registro.html" class="text-white">¡Regístrate!</a>
                                <a href="/paginas/recupera_tu_contrasena.html" class="text-white">¿Olvidaste tu
                                    contraseña?</a>
                            </div>

                            <!-- Mensaje de error general -->
                            <div id="mensajeError" class="alert alert-danger d-none mb-3"></div>

                            <!-- Botón de envío -->
                            <button type="submit" class="btn btn-ejemplo text-white mb-4 boton-ejemplo"
                                id="btnIniciarSesion">
                                Iniciar sesión
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Activa componentes interactivos de Bootstrap -->

    <!-- Barra de navegación -->
    <script src="/activos/js/barra_navegacion.js"></script>
    <!-- Footer -->
    <script src="/activos/js/footer.js"></script>

</body>

</html>
