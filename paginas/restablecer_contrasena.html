<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablece tu contraseña | Fénix Láser</title>
    <link rel="icon" href="/activos/imagenes/iconos/logo_fenix_favicon.png">

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Importa los estilos de Bootstrap desde un CDN -->

    <!-- Referencia para iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Permite usar íconos de Bootstrap -->

    <!-- CSS externo -->
    <link rel="stylesheet" href="/activos/css/global.css">
    <!-- Estilos globales del proyecto -->

    <link rel="stylesheet" href="/activos/css/restablecer_contrasena.css">
    <!-- Estilos específicos de la página de inicio de sesión -->

    <!-- Estilos especificos del footer -->
    <link rel="stylesheet" href="/activos/css/footer.css">

    <link rel="stylesheet" href="/activos/css/barra_navegacion.css">


</head>

<body>
    <div id="navbar"></div>
    <main>

        <div class="container">
            <!-- Contenedor principal que centra el contenido -->

            <div class="row justify-content-center">
                <!-- Fila con el contenido centrado horizontalmente -->

                <div class="col-md-5">
                    <!-- Columna de 5 espacios en pantallas medianas -->

                    <div class="login-card p-5 shadow-lg text-center">
                        <!-- Tarjeta del login con padding y sombra -->

                        <h2 class="fw-bold mb-4" style="color:#E86C1A;">Restablece tu contraseña</h2>
                        <!-- Título principal -->

                        <form id="formRestablecer" novalidate>
                            <div class="mb-4 text-start">
                                <label class="form-label fw-bold">Contraseña nueva</label>
                                <input type="password" id="pass1" class="form-control text-white"
                                    placeholder="Ingresa tu nueva contraseña" required>
                            </div>

                            <div class="mb-4 text-start">
                                <label class="form-label fw-bold">Confirma tu nueva contraseña</label>
                                <input type="password" id="pass2" class="form-control text-white"
                                    placeholder="Ahora confirma la contraseña" required>
                            </div>

                            <button type="button" id="btnActualizar"
                                class="btn btn-ejemplo text-white mb-4 boton-ejemplo">
                                Continuar
                            </button>
                        </form>
                   

                    </div>
                </div>
            </div>
        </div>
    </main>
        <script src="/activos/js/restablecer_contrasena.js"></script>

    <!-- Footer (carga dinámica) -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Activa componentes interactivos de Bootstrap -->

    <script src="/activos/js/barra_navegacion.js"></script>
    <!-- Footer -->
    <script src="/activos/js/footer.js"></script>

</body>

</html>
