<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras Personalizado | Fénix Láser</title>
    <link rel="icon" href="/activos/imagenes/iconos/logo_fenix_favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/activos/css/global.css">
    <link rel="stylesheet" href="/activos/css/carrito_productos.css">
    <link rel="stylesheet" href="/activos/css/barra_navegacion.css">
    <link rel="stylesheet" href="/activos/css/footer.css">

</head>

<body>
    <!-- Barra de navegación -->
    <div id="navbar"></div>

    <main class="container my-5">
        <div class="card shadow-lg contenedor-carrito">
            <div class="row g-0">

                <div class="col-lg-8 columna-productos" id="carrito-items">

                    <div class="d-flex align-items-center mb-4">
                        <a href="/paginas/catalogo.html" class="regresar">← Regresar</a>
                        <h4 class="texto-carrito">Carrito de Compras</h4>
                    </div>
                </div>
                <aside class="col-lg-4 columna-resumen">
                    <h3 class="text-center fw-bold mb-4 divisores-div pb-3">Resumen</h3>

                    <!-- Encabezados -->
                    <div class="d-flex justify-content-between mb-3 fw-bold">
                        <span>Artículos</span>
                        <span>Precio</span>
                    </div>

                    <!-- LISTA DE PRODUCTOS (se genera dinámicamente) -->
                    <div id="resumen-items" class="mb-4">
                        <!-- Los items se generan aquí dinámicamente -->
                    </div>

                    <!-- Total de productos con línea divisoria -->
                    <div class="divisores-div d-flex justify-content-between mb-3 pb-3 fw-bold">
                        <span>Total de productos:</span>
                        <span id="cart-items-count">0 productos</span>
                    </div>

                    <!-- SECCIÓN DE DESCUENTO (comentada por ahora) -->
                    <!-- 
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span>Código de descuento</span>
        <span class="etiqueta-descuento">HAPPY ✓</span>
    </div>

    <p class="text-end text-muted small mb-2">¡Felicidades! Tienes % de descuento</p>

    <div class="d-flex justify-content-between mb-3 pb-3 divisores-div">
        <span>Descuento Total:</span>
        <span id="cart-discount">-$0.00</span>
    </div>
    -->

                    <!-- Precio Final con línea divisoria -->
                    <div class="d-flex justify-content-between align-items-center mb-4 pt-3 fw-bold"
                        style="font-size: 1.2rem; color: var(--night);">
                        <span>Precio Final:</span>
                        <span id="cart-total">$0.00</span>
                    </div>

                    <!-- Botones de acción -->
                    <a href="/paginas/confirmacion_y_pago.html">
                        <button class="boton-principal-pago w-100 shadow-sm mb-3">
                            Pagar ahora
                        </button>
                    </a>

                    <button id="vaciar-carrito" class="btn btn-danger w-100">
                        Vaciar carrito
                    </button>

                    <!-- Métodos de pago (opcional, puedes agregarlo después) -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <small class="text-muted d-block mb-2">Métodos de pago aceptados:</small>
                        <div class="d-flex justify-content-center gap-2">
                            <img src="https://img.icons8.com/color/32/000000/amex.png" alt="American Express"
                                title="American Express">
                            <img src="https://img.icons8.com/color/32/000000/mastercard.png" alt="Mastercard"
                                title="Mastercard">
                            <img src="https://img.icons8.com/color/32/000000/visa.png" alt="Visa" title="Visa">
                            <img src="https://img.icons8.com/color/32/000000/paypal.png" alt="PayPal" title="PayPal">
                        </div>
                    </div>
                </aside>



            </div>
        </div>
    </main>

    <!-- Footer (carga dinámica) -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/activos/js/barra_navegacion.js"></script>
    <!-- Footer -->
    <script src="/activos/js/footer.js"></script>
    <script src="/activos/js/carrito_productos.js"></script>
</body>

</html>
